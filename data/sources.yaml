# Manifest of the public source corpus. Curated by hand: don't crawl. See docs/03-local-setup.md § 3.7.
#
# Fields
#   id            stable id; the file is saved as data/raw/<id>.pdf
#   doc_type      act | rules | circular | notification
#   act           the parent Act, stored on every chunk (two Income-tax Acts co-exist)
#   circular_no / notification_no / issued_on   citation metadata (issued_on is YYYY-MM-DD)
#   url           official source. For manual entries it may be the circular's landing page
#   manual        true = the host blocks scripted downloads (incometaxindia.gov.in, indiacode.nic.in).
#                 Save the PDF by hand as data/raw/<id>.pdf; the sha256 check still applies.
#   sha256        filled in by: uv run python scripts/download_sources.py --update-hashes

