[project]
name = "taxlens"
version = "0.1.0"
description = "AI tax & legal document assistant for Indian tax law: cited answers, document review, PII masking."
readme = "README.md"
# Keep in sync with requirements.txt / requirements-dev.txt.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "python-multipart>=0.0.33",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "azure-cosmos>=4.17,<5",
    "pinecone>=10.3,<11",
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-readers-file>=0.7,<0.8",
    "llama-index-embeddings-fastembed>=0.7,<0.8",
    "pymupdf>=2.1,<3",
    "fastembed>=0.9,<1",
    "langgraph>=1.2,<2",
    "langchain-core>=1.7,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-groq>=1.1,<2",
    "langchain-ollama>=1.1,<2",
    "pyjwt>=2.15,<3",
    "pwdlib[argon2]>=0.3,<1",
    "presidio-analyzer>=2.2.366,<3",
    "presidio-anonymizer>=2.2.366,<3",
    "spacy>=3.8,<4",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "azure-storage-blob>=12.31,<13",
    "azure-storage-queue>=12.18,<13",
    "azure-identity>=1.27,<2",
    "azure-keyvault-secrets>=4.12,<5",
    "arize-phoenix-otel>=0.17,<1",
    "openinference-instrumentation-langchain>=0.1.81,<0.2",
    "openinference-instrumentation-llama-index>=4.7,<5",
    "langsmith>=0.14,<1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
extensions = [
    "qdrant-client>=1.20,<2",
    "oracledb>=26.1,<27",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "types-PyYAML>=6.0.12",
    "pre-commit>=4.7,<5",
    "truststore>=0.10,<1",          # OS trust store for scripts/download_sources.py
]

[tool.uv]
# Copy packages into .venv instead of hard-linking them from the uv cache: nltk (used by
# llama_index's SentenceSplitter) refuses to open hard-linked data files (CWE-59 check).
# The Dockerfile sets UV_LINK_MODE=copy for the same reason.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]          # code snippets in docs are illustrative, not linted

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]   # S = bandit security rules
ignore = ["S101"]                                     # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]                       # dummy passwords/hashes in fixtures

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs Azurite and a Pinecone API key (uses a throwaway namespace)",
    "cosmos: needs the Cosmos DB emulator (docker compose --profile cosmos up -d)",
    "eval: calls real LLMs; run only in the eval job",
    "slow: loads a local ONNX model (downloaded to .models/ on first use)",
]
addopts = "-m 'not eval and not integration and not cosmos' --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
