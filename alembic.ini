# Alembic config for the SQLite repository (local dev, CI, tests).
# Cosmos DB in Azure is schemaless; its containers are created by infra/deploy.sh.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Left empty on purpose: migrations/env.py builds the URL from SQLITE_PATH (settings / .env).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
